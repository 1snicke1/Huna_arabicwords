<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Huna Arabic — Карточки</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Noto+Naskh+Arabic:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">

  <!-- ===== HOME SCREEN ===== -->
  <section id="screen-home" class="screen">
    <header class="brand-header">
      <div class="brand-mark">
        <svg viewBox="0 0 48 48" class="brand-icon" aria-hidden="true">
          <path d="M24 4 C30 10 34 16 34 23 C34 30 30 35 24 39 C18 35 14 30 14 23 C14 16 18 10 24 4 Z" fill="none" stroke="currentColor" stroke-width="2"/>
          <path d="M24 12 L24 39 M17 20 L31 20" stroke="currentColor" stroke-width="1.4" opacity="0.6"/>
          <circle cx="24" cy="16" r="2.4" fill="currentColor"/>
        </svg>
      </div>
      <div class="brand-text">
        <div class="brand-name">HUNA ARABIC</div>
        <div class="brand-sub">Академия арабского языка</div>
      </div>
    </header>

    <div class="hero-stat">
      <div class="hero-number" id="due-count">0</div>
      <div class="hero-label" id="hero-label">слов к повторению сегодня</div>
    </div>

    <div class="stat-row">
      <div class="stat-chip">
        <div class="stat-chip-num" id="stat-learned">0</div>
        <div class="stat-chip-label">выучено</div>
      </div>
      <div class="stat-chip">
        <div class="stat-chip-num" id="stat-total">771</div>
        <div class="stat-chip-label">всего слов</div>
      </div>
      <div class="stat-chip">
        <div class="stat-chip-num" id="stat-streak">0</div>
        <div class="stat-chip-label">дней подряд</div>
      </div>
    </div>

    <div class="vol-filter" id="vol-filter">
      <button class="vol-chip active" data-vol="all">Оба тома</button>
      <button class="vol-chip" data-vol="1">Том I</button>
      <button class="vol-chip" data-vol="2">Том II</button>
    </div>

    <button class="cta-button" id="btn-start">
      <span>Начать повторение</span>
      <svg viewBox="0 0 24 24" width="20" height="20"><path d="M8 5l8 7-8 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>

    <button class="link-button" id="btn-stats">Подробная статистика</button>
  </section>

  <!-- ===== STUDY SCREEN ===== -->
  <section id="screen-study" class="screen hidden">
    <button class="back-btn back-btn-inpage hidden" data-back><svg viewBox="0 0 24 24" width="18" height="18"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <div class="study-topbar">
      <div class="progress-track"><div class="progress-fill" id="study-progress-fill"></div></div>
      <div class="study-count"><span id="study-idx">0</span>/<span id="study-total">0</span></div>
    </div>

    <div class="card-area">
      <div class="flashcard" id="flashcard">
        <div class="card-face card-front">
          <div class="card-kicker" id="card-vol-kicker">Том I</div>
          <div class="card-arabic" id="card-arabic" dir="rtl" lang="ar"></div>
          <div class="tap-hint">Нажмите, чтобы посмотреть перевод</div>
        </div>
        <div class="card-face card-back hidden" id="card-back">
          <div class="card-arabic card-arabic-small" id="card-arabic-2" dir="rtl" lang="ar"></div>
          <div class="card-divider"></div>
          <div class="card-translation" id="card-translation"></div>
        </div>
      </div>
    </div>

    <div class="grade-row hidden" id="grade-row">
      <button class="grade-btn grade-again" data-grade="0">
        <span class="grade-label">Забыл</span>
      </button>
      <button class="grade-btn grade-hard" data-grade="1">
        <span class="grade-label">Трудно</span>
      </button>
      <button class="grade-btn grade-good" data-grade="2">
        <span class="grade-label">Хорошо</span>
      </button>
      <button class="grade-btn grade-easy" data-grade="3">
        <span class="grade-label">Легко</span>
      </button>
    </div>
  </section>

  <!-- ===== SESSION DONE SCREEN ===== -->
  <section id="screen-done" class="screen hidden">
    <div class="done-wrap">
      <svg viewBox="0 0 48 48" class="done-icon" aria-hidden="true">
        <circle cx="24" cy="24" r="21" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M15 24l6 6 12-13" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div class="done-title">Сессия завершена</div>
      <div class="done-sub" id="done-sub">Вы повторили 0 слов</div>

      <div class="done-stats">
        <div class="done-stat"><div class="done-stat-num" id="done-new">0</div><div class="done-stat-label">новых</div></div>
        <div class="done-stat"><div class="done-stat-num" id="done-reviewed">0</div><div class="done-stat-label">повторено</div></div>
        <div class="done-stat"><div class="done-stat-num" id="done-again">0</div><div class="done-stat-label">забыто</div></div>
      </div>

      <button class="cta-button" id="btn-done-home">Вернуться</button>
    </div>
  </section>

  <!-- ===== STATS SCREEN ===== -->
  <section id="screen-stats" class="screen hidden">
    <button class="back-btn back-btn-inpage hidden" data-back><svg viewBox="0 0 24 24" width="18" height="18"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <div class="stats-title">Статистика</div>

    <div class="stats-block">
      <div class="stats-row"><span>Новые</span><span id="s-new">0</span></div>
      <div class="stats-row"><span>Изучаются</span><span id="s-learning">0</span></div>
      <div class="stats-row"><span>Повторяются</span><span id="s-review">0</span></div>
      <div class="stats-row"><span>Освоено</span><span id="s-mastered">0</span></div>
    </div>

    <div class="stats-block">
      <div class="stats-row"><span>Том I</span><span id="s-vol1">0 / 386</span></div>
      <div class="stats-row"><span>Том II</span><span id="s-vol2">0 / 385</span></div>
    </div>

    <div class="settings-row">
      <label for="daily-limit">Новых слов в день</label>
      <select id="daily-limit">
        <option value="10">10</option>
        <option value="15" selected>15</option>
        <option value="20">20</option>
        <option value="30">30</option>
        <option value="9999">Без ограничений</option>
      </select>
    </div>

    <button class="link-button danger" id="btn-reset">Сбросить весь прогресс</button>
  </section>

</div>

<script src="words-data.js"></script>
<script src="app.js"></script>
</body>
</html>
