<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<title>Huna Arabic — Карточки</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Noto+Naskh+Arabic:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=6">
</head>
<body>

<div id="app">

  <!-- ===== HOME SCREEN ===== -->
  <section id="screen-home" class="screen">
    <header class="brand-header">
      <div class="brand-mark">
        <img src="assets/logo-mark.png" alt="Huna Arabic" class="brand-icon">
      </div>
      <div class="brand-text">
        <div class="brand-name">HUNA ARABIC</div>
        <div class="brand-sub">Академия арабского языка</div>
      </div>
      <div class="streak-pill" id="streak-pill" title="Дней подряд">
        <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true"><path d="M12 3c1 3.5 5 5.5 5 10a5 5 0 0 1-10 0c0-2 1-3.5 2-4.5.3 1.6 1.2 2.6 2.3 3C11 8.5 11.5 5.5 12 3z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span id="stat-streak">0</span>
      </div>
    </header>

    <div class="book-tabs" id="book-tabs" role="tablist" aria-label="Учебник"></div>

    <div class="today-card">
      <div class="today-head">
        <span class="today-title">Сегодня</span>
        <span class="today-eta" id="today-eta"></span>
      </div>
      <div class="today-body">
        <div class="today-ring">
          <svg viewBox="0 0 104 104" width="104" height="104" aria-hidden="true">
            <defs><linearGradient id="ring-grad" x1="0" x2="1"><stop offset="0" stop-color="#19637a"/><stop offset="1" stop-color="#35a9bf"/></linearGradient></defs>
            <circle cx="52" cy="52" r="44" class="ring-track"/>
            <circle cx="52" cy="52" r="44" class="ring-fill" id="ring-fill"/>
          </svg>
          <div class="today-ring-center">
            <div class="today-num" id="due-count">0</div>
            <div class="today-num-label" id="due-count-label">карточек</div>
          </div>
        </div>
        <div class="today-streak">
          <div class="today-streak-title">Ударный режим</div>
          <div class="week-strip" id="week-strip"></div>
          <div class="today-streak-msg" id="streak-msg"></div>
        </div>
      </div>
      <div class="hero-label" id="hero-label"></div>
      <div class="dir-label" id="dir-label">Направление</div>
      <div class="dir-seg" role="radiogroup" aria-labelledby="dir-label">
        <button class="dir-btn" data-dir="fwd" role="radio">Ар → Рус</button>
        <button class="dir-btn" data-dir="rev" role="radio">Рус → Ар</button>
        <button class="dir-btn" data-dir="both" role="radio">Оба</button>
      </div>
      <button class="cta-button" id="btn-start">
        <span id="btn-start-label">Начать занятие</span>
        <svg viewBox="0 0 24 24" width="20" height="20"><path d="M8 5l8 7-8 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button class="today-section" id="btn-sections">
        <span>Раздел:</span> <b id="section-summary">Все главы</b> <em>Изменить</em>
      </button>
    </div>

    <div class="tool-grid">
      <button class="tool-tile" id="btn-numbers">
        <span class="tool-icon is-arabic" aria-hidden="true">١٢٣</span>
        <span class="tool-name">Числительные</span>
        <span class="tool-sub">от 1 до 1000</span>
      </button>
      <button class="tool-tile" id="btn-stats">
        <span class="tool-icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="22" height="22"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></span>
        <span class="tool-name">Статистика</span>
        <span class="tool-sub">и настройки</span>
      </button>
    </div>
  </section>

  <!-- ===== CHAPTERS / SECTIONS SCREEN ===== -->
  <section id="screen-chapters" class="screen hidden">
    <button class="back-btn back-btn-inpage hidden" data-back><svg viewBox="0 0 24 24" width="18" height="18"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <div class="stats-title">Разделы</div>
    <div class="stats-book" id="chapters-book"></div>

    <button class="all-chapters-row" id="btn-all-chapters">
      <span id="all-chapters-label">Все главы и диалоги</span>
      <span class="check-circle" id="check-all"></span>
    </button>

    <div id="chapters-list"></div>
  </section>

  <!-- ===== STUDY SCREEN ===== -->
  <section id="screen-study" class="screen hidden">
    <button class="back-btn back-btn-inpage hidden" data-back><svg viewBox="0 0 24 24" width="18" height="18"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <div class="study-topbar">
      <div class="progress-track"><div class="progress-fill" id="study-progress-fill"></div></div>
      <button class="undo-btn js-undo hidden" id="btn-undo" aria-label="Отменить и вернуться к предыдущему слову">
        <svg viewBox="0 0 24 24" width="16" height="16"><path d="M9 15 4 10l5-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 10h10.5A5.5 5.5 0 0 1 20 15.5v0a5.5 5.5 0 0 1-5.5 5.5H11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="study-count" title="Новые · Изучаются · Повторение">
        <span class="count-new" id="count-new">0</span>
        <span class="count-learn" id="count-learn">0</span>
        <span class="count-review" id="count-review">0</span>
      </div>
    </div>

    <div class="card-area">
      <div class="flashcard" id="flashcard">
        <div class="card-face card-front">
          <div class="card-kicker" id="card-vol-kicker">Том I</div>
          <div class="card-word" id="card-front-word"></div>
          <div class="tap-hint" id="tap-hint">Нажмите, чтобы посмотреть перевод</div>
        </div>
        <div class="card-face card-back hidden" id="card-back">
          <div class="card-word card-word-small" id="card-back-prompt"></div>
          <div class="card-divider"></div>
          <div class="card-answer" id="card-back-answer"></div>
          <div class="card-context hidden" id="card-context"></div>
          <div class="card-context-tr hidden" id="card-context-tr"></div>
        </div>
      </div>
    </div>

    <div class="grade-row hidden" id="grade-row">
      <button class="grade-btn grade-again" data-grade="0">
        <span class="grade-label">Забыл</span>
        <span class="grade-ivl"></span>
      </button>
      <button class="grade-btn grade-hard" data-grade="1">
        <span class="grade-label">Трудно</span>
        <span class="grade-ivl"></span>
      </button>
      <button class="grade-btn grade-good" data-grade="2">
        <span class="grade-label">Хорошо</span>
        <span class="grade-ivl"></span>
      </button>
      <button class="grade-btn grade-easy" data-grade="3">
        <span class="grade-label">Легко</span>
        <span class="grade-ivl"></span>
      </button>
    </div>
  </section>

  <!-- ===== SESSION DONE SCREEN ===== -->
  <section id="screen-done" class="screen hidden">
    <div class="done-wrap">
      <svg viewBox="0 0 48 48" class="done-icon" aria-hidden="true">
        <circle cx="24" cy="24" r="21" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M15 24l6 6 12-13" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div class="done-title">Сессия завершена</div>
      <div class="done-sub" id="done-sub">Вы повторили 0 слов</div>

      <div class="done-stats">
        <div class="done-stat"><div class="done-stat-num" id="done-new">0</div><div class="done-stat-label">новых</div></div>
        <div class="done-stat"><div class="done-stat-num" id="done-reviewed">0</div><div class="done-stat-label">повторено</div></div>
        <div class="done-stat"><div class="done-stat-num" id="done-again">0</div><div class="done-stat-label">забыто</div></div>
      </div>

      <button class="cta-button" id="btn-done-home">Вернуться</button>
      <button class="link-button js-undo hidden" id="btn-done-undo">Отменить последнюю оценку</button>
    </div>
  </section>

  <!-- ===== NUMBERS TRAINER SCREEN ===== -->
  <section id="screen-numbers" class="screen hidden">
    <button class="back-btn back-btn-inpage hidden" data-back><svg viewBox="0 0 24 24" width="18" height="18"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <div class="numbers-head">
      <div class="stats-title">Числительные</div>
      <div class="numbers-score" id="num-score"></div>
    </div>

    <div class="num-modes" role="tablist" aria-label="Режим">
      <button class="num-mode" data-mode="say">Число → по-арабски</button>
      <button class="num-mode" data-mode="read">По-арабски → число</button>
    </div>
    <div class="num-ranges" id="num-ranges"></div>

    <div class="card-area">
      <div class="flashcard num-card" id="num-card">
        <div class="card-face" id="num-front">
          <div class="num-front-main" id="num-front-main"></div>
          <div class="num-front-sub" id="num-front-sub"></div>
          <div class="tap-hint" id="num-hint"></div>
        </div>
        <div class="card-face hidden" id="num-back">
          <div class="num-back-prompt" id="num-back-prompt"></div>
          <div class="card-divider"></div>
          <div class="num-back-answer" id="num-back-answer"></div>
          <div class="num-parts" id="num-parts"></div>
          <div class="num-rule" id="num-rule"></div>
        </div>
      </div>
    </div>

    <div class="num-grade-row hidden" id="num-grade-row">
      <button class="grade-btn grade-again" id="num-miss"><span class="grade-label">Не знал</span><span class="grade-ivl">повторим скоро</span></button>
      <button class="grade-btn grade-good" id="num-hit"><span class="grade-label">Знал</span><span class="grade-ivl">дальше</span></button>
    </div>
  </section>

  <!-- ===== STATS SCREEN ===== -->
  <section id="screen-stats" class="screen hidden">
    <button class="back-btn back-btn-inpage hidden" data-back><svg viewBox="0 0 24 24" width="18" height="18"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    <div class="stats-title">Статистика</div>
    <div class="stats-book" id="stats-book"></div>

    <div class="stats-chips">
      <div class="stats-chip"><b id="s-today-new">0</b><span>новых сегодня</span></div>
      <div class="stats-chip"><b id="s-tomorrow">0</b><span>к повторению завтра</span></div>
      <div class="stats-chip"><b id="s-streak">0</b><span>дней подряд</span></div>
    </div>

    <div class="stats-block" id="s-dirs"></div>

    <div class="stats-block" id="s-vols"></div>

    <div class="stats-block">
      <div class="stats-row settings-line">
        <label for="daily-limit">Новых слов в день<small>на каждое направление</small></label>
        <select id="daily-limit">
          <option value="10">10</option>
          <option value="15" selected>15</option>
          <option value="20">20</option>
          <option value="30">30</option>
          <option value="9999">Без ограничений</option>
        </select>
      </div>
      <button class="stats-row settings-line settings-link" id="btn-support">
        <span>Написать в поддержку</span>
        <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>

    <div class="stats-foot">
      <button class="link-button danger" id="btn-reset">Сбросить весь прогресс</button>
      <button class="credit-link" id="btn-credit">Made by <b>ItqanLab</b></button>
    </div>
  </section>

</div>

<script src="words-data.js?v=5"></script>
<script src="words-bayna2.js?v=5"></script>
<script src="app.js?v=6"></script>
</body>
</html>
